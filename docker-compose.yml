services:
  abnehm-app:
    build: .
    container_name: abnehm-app
    restart: unless-stopped
    ports:
      - "7854:8000"
    volumes:
      - ./data:/data
      # Netzlaufwerk (NFS) für die nächtlichen Backups. Der Elternordner wird mit "rslave" eingebunden,
      # damit ein später (neu) gemountetes NFS-Laufwerk auch im laufenden Container sichtbar wird.
      - type: bind
        source: /mnt/abnehm-app
        target: /mnt/abnehm-app
        bind:
          propagation: rslave
    # SMTP-Zugangsdaten für die Bestätigungsmails (nur auf dem Server, nicht im git) – Vorlage: .env.example
    env_file:
      - path: .env
        required: false
    environment:
      # Öffentliche Adresse für Links in E-Mails
      PUBLIC_URL: "https://bissfest.facgooder.de"
      # Link zum Quellcode, erscheint in den Einstellungen (Pflicht bei geänderten Fassungen, AGPL § 13)
      SOURCE_URL: ""
      # Nach dem Anlegen aller Konten auf "false" setzen, damit sich niemand Fremdes registriert
      ALLOW_REGISTRATION: "true"
      # Admins für https://…/admin (Benutzernamen, kommagetrennt)
      ADMIN_USERS: "sebastian"
      # App läuft hinter HTTPS (https://bissfest.facgooder.de) – Login-Cookie nur über HTTPS senden
      COOKIE_SECURE: "true"
      # Kostenloser Key: https://fdc.nal.usda.gov/api-key-signup  (DEMO_KEY = stark limitiert, leer = USDA aus)
      FDC_API_KEY: "DEMO_KEY"
      OFF_COUNTRY: "de"
      TZ: "Europe/Berlin"
      BACKUP_DIR: "/mnt/abnehm-app/backup"
      # Uhrzeit der nächtlichen Sicherung (leer = aus) und wie lange Backups aufbewahrt werden
      BACKUP_TIME: "03:00"
      BACKUP_KEEP_DAYS: "30"
      # Kontaktadresse für die Push-Dienste (Apple/Google), Pflichtangabe für Push-Nachrichten
      VAPID_SUBJECT: "https://bissfest.facgooder.de"
